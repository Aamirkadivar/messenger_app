language = "C"
header = "// Generated by cbindgen from mls-core. Do not edit by hand."
include_guard = "MLS_CORE_H"
autogen_warning = "// Regenerate with: cargo build -p mls_core"
cpp_compat = true
documentation = true
documentation_style = "c99"

[export]
prefix = ""
# Error codes and ABI_VERSION are consts, not just functions.
include = ["MlsBuf"]

[parse]
parse_deps = false

[fn]
sort_by = "None"

[const]
allow_static_const = true
