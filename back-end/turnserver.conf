# coturn config for call NAT traversal (audio calls, see websocket/calls.go
# and windows_app/android call signaling). Everything auth-secret-specific
# (the shared secret itself) is passed in as a --static-auth-secret command
# line arg from docker-compose.yml (sourced from .env's TURN_SECRET) rather
# than baked in here, so this file stays safe to commit.

listening-port=3478
tls-listening-port=5349
listening-ip=0.0.0.0

# Narrow relay port range so only a small, predictable set of ports needs to
# be opened/forwarded on the host, instead of coturn's default 49152-65535.
min-port=49160
max-port=49200

# Long-term credential mechanism with a shared secret: the backend computes
# short-lived (see handlers/calls.go GetIceServers, ~6h TTL) username/password
# pairs from TURN_SECRET, rather than provisioning a fixed account per user.
lt-cred-mech
use-auth-secret

realm=messenger.local

# Adds a fingerprint attribute STUN/TURN responses - required by most modern
# WebRTC stacks (including libdatachannel/WebRTC) to accept a TURN server.
fingerprint

no-cli
no-tlsv1
no-tlsv1_1

# Local/dev-friendly logging; tighten before exposing this on a public host.
log-file=stdout
verbose
